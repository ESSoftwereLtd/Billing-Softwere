<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AK Builders - Online Billing System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<!-- Professional Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#f4f7f6; color:#334155; min-height:100vh; font-family:'Inter', sans-serif;}
  .hidden{display:none !important;}

  /* Top Bar */
  .top-bar{
    background:linear-gradient(135deg, #064e3b, #047857);
    color:#fff;padding:16px;border-radius:0 0 20px 20px;
    box-shadow:0 6px 16px rgba(6,78,59,.3);
    position:sticky;top:0;z-index:100;
    display:flex;align-items:center;gap:12px;
  }
  .top-bar .icon-btn{
    background:rgba(255,255,255,.15);border:none;color:#fff;
    width:36px;height:36px;border-radius:10px;font-size:18px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:.2s;
  }
  .top-bar .icon-btn:active{transform:scale(.9);}
  .top-bar .title-wrap{flex:1;min-width:0;}
  .top-bar h1{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top-bar .sub{font-size:11px;opacity:.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top-bar .top-actions{display:flex;gap:6px;}
  .top-bar .top-btn{
    background:rgba(255,255,255,.15);border:none;color:#fff;
    padding:6px 10px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;
    transition:.2s;white-space:nowrap;
  }
  .top-bar .top-btn:active{transform:scale(.95);}

  /* Breadcrumb */
  .breadcrumb{
    padding:10px 16px;font-size:11px;color:#64748b;
    background:#fff;border-bottom:1px solid #e2e8f0;
    display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  }
  .breadcrumb span{color:#047857;font-weight:600;}

  .container{max-width:900px;margin:0 auto;padding:16px;padding-bottom:80px;}

  /* Search Bar */
  .search-bar{
    background:#fff; padding:12px 16px; border-radius:12px; margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.05); display:flex; align-items:center; gap:10px;
  }
  .search-bar input{
    flex:1; border:none; outline:none; font-size:14px; background:transparent;
    color:#334155; font-family:inherit;
  }
  .search-bar input::placeholder{color:#94a3b8;}
  .search-bar button{
    background:#047857; color:#fff; border:none; padding:8px 14px; border-radius:8px;
    font-size:12px; font-weight:600; cursor:pointer;
  }

  /* UI Components */
  .card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);border:1px solid #e2e8f0;}
  .card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;color:#0f172a;}
  .list-item{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border-left:4px solid #047857;cursor:pointer;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;justify-content:space-between;align-items:center;}
  .list-item:active{transform:scale(.98);}
  .list-item.owner-item{border-left-color:#8b5cf6;}
  .list-item.cat-item{border-left-color:#0891b2;}
  .list-item .item-info{flex:1;min-width:0;}
  .list-item h3{font-size:15px;margin-bottom:3px;color:#0f172a;}
  .list-item .meta{font-size:11px;color:#64748b;}
  .list-item .stats{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .list-item .stats span{font-size:10px;padding:3px 7px;border-radius:5px;font-weight:600;}
  .s-total{background:#ecfdf5;color:#047857;}
  .s-paid{background:#dcfce7;color:#166534;}
  .s-due{background:#fee2e2;color:#991b1b;}
  .s-count{background:#f3e8ff;color:#6d28d9;}
  .list-item .arrow{font-size:22px;color:#94a3b8;margin-left:8px;}

  .btn{padding:11px 16px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:#047857;color:#fff;}
  .btn-success{background:#10b981;color:#fff;}
  .btn-danger{background:#ef4444;color:#fff;}
  .btn-owner{background:#8b5cf6;color:#fff;}
  .btn-cat{background:#0891b2;color:#fff;}
  .btn-outline{background:#fff;color:#0f172a;border:1.5px solid #e2e8f0;}
  .btn-sm{padding:8px 12px;font-size:12px;width:auto;}

  .form-group{margin-bottom:12px;}
  .form-group label{display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:6px;}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;background:#fff;transition:.2s;font-family:inherit;}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#047857;box-shadow:0 0 0 3px rgba(4,120,87,.1);}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:480px){.form-row{grid-template-columns:1fr;}}

  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .stat-card{background:#fff;border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .stat-card .label{font-size:10px;color:#64748b;margin-bottom:4px;}
  .stat-card .value{font-size:15px;font-weight:800;}
  .stat-card.total .value{color:#047857;}
  .stat-card.paid .value{color:#10b981;}
  .stat-card.due .value{color:#ef4444;}

  .empty{text-align:center;padding:40px 20px;color:#64748b;}
  .empty .icon{font-size:48px;margin-bottom:10px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff;border-radius:18px;max-width:500px;width:100%;max-height:92vh;overflow-y:auto;padding:20px;animation:slideUp .3s ease; position:relative;}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal h2{font-size:17px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;color:#0f172a;}
  .modal-close{background:#f1f5f9;border:none;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer;color:#64748b;line-height:1; display:flex; align-items:center; justify-content:center; transition:0.2s;}
  .modal-close:hover { background: #fee2e2; color: #ef4444; }

  /* Toast */
  .toast{
    position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px);
    background:#0f172a; color:#fff; padding:12px 24px; border-radius:10px;
    font-size:13px; font-weight:600; z-index:9999; transition:all .3s cubic-bezier(0.68, -0.55, 0.27, 1.55); 
    box-shadow:0 8px 20px rgba(0,0,0,.2); max-width:90%; text-align:center; pointer-events: none;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }
  .toast.success{background:#10b981;}
  .toast.error{background:#ef4444;}

  .fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg, #064e3b, #047857);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 8px 20px rgba(4,120,87,.4);z-index:99;display:flex;align-items:center;justify-content:center;transition:.2s;}
  .fab:active{transform:scale(.9);}

  /* Loading Screen */
  #loadingScreen {
    position: fixed; inset: 0; background: #064e3b; color: #fff; z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .spinner {
    border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #fff;
    border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  /* =====================================================
     PREMIUM INVOICE TEMPLATE
  ===================================================== */
  .invoice-wrap{
    font-size:13px;color:#1e293b;background:#fff;padding:45px;font-family:'Inter', sans-serif;
    width: 100%; max-width: 850px; margin: 0 auto; border-radius: 8px; border: 1px solid #e2e8f0;
    line-height: 1.5; position:relative;
  }
  
  /* Decorative top border */
  .invoice-wrap::before {
    content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 6px;
    background: linear-gradient(90deg, #047857, #10b981, #34d399); border-radius: 8px 8px 0 0;
  }

  /* Header Layout (Left Logo, Right Info) */
  .inv-top-header{
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #e2e8f0; padding-bottom: 25px; margin-bottom: 25px;
  }
  .inv-logo-area img{ max-height: 80px; max-width: 150px; object-fit: contain; }
  .inv-company-info{ text-align: right; }
  .inv-company-info h1{
    font-size: 28px; font-family: 'Playfair Display', serif; font-weight: 900;
    color: #dc2626; letter-spacing: 0.5px; margin-bottom: 6px;
  }
  .inv-company-info p{ font-size: 13px; color: #64748b; margin-bottom: 3px; }
  .inv-company-info .email{ font-weight: 600; color: #047857; }

  /* Details Layout */
  .inv-details{ display: flex; justify-content: space-between; margin-bottom: 25px; }
  .inv-bill-to h4{ font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 8px; font-weight: 700;}
  .inv-bill-to p{ font-size: 14px; font-weight: 600; color: #0f172a; margin-bottom: 3px; }
  .inv-bill-to p.sub{ font-size: 12px; font-weight: 400; color: #64748b; }

  .inv-meta{ text-align: right; }
  .inv-meta h2{ font-size: 30px; font-family: 'Playfair Display', serif; font-weight: 700; color: #047857; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 12px; }
  .inv-meta .meta-row{ display: flex; justify-content: flex-end; gap: 15px; font-size: 13px; margin-bottom: 5px; white-space: nowrap; }
  .inv-meta .meta-row span:first-child{ color: #94a3b8; font-weight: 600; }
  .inv-meta .meta-row span:last-child{ font-weight: 700; color: #0f172a; width: 120px; text-align: right; }

  /* Subject Box Centered */
  .inv-subject-wrapper{ text-align: center; margin-bottom: 25px; }
  .inv-subject{
    display: inline-block; background: #f8fafc; border: 1px solid #e2e8f0;
    padding: 8px 20px; font-size: 14px; font-weight: 600; color: #334155;
    border-radius: 20px; box-shadow: 0 2px 4px rgba(0,0,0,.02);
  }

  /* Table */
  .inv-table{ width:100%; border-collapse:collapse; margin-bottom:25px; table-layout:fixed; }
  .inv-table th{
    background: #f8fafc; color: #475569; font-size:12px; padding:14px 10px;
    text-align:left; text-transform:uppercase; letter-spacing: 0.5px; font-weight: 700;
    border-bottom: 2px solid #cbd5e1;
  }
  .inv-table th:last-child, .inv-table td:last-child{ text-align:right; }
  .inv-table th:nth-child(3), .inv-table td:nth-child(3),
  .inv-table th:nth-child(4), .inv-table td:nth-child(4){ text-align:center; }
  .inv-table td{ padding:14px 10px; border-bottom:1px solid #e2e8f0; font-size:13px; line-height: 1.6; color:#334155; word-wrap: break-word;}

  /* Totals Area */
  .inv-totals-area{ display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
  .payment-terms{ width: 50%; font-size: 12px; color: #64748b; line-height: 1.6; }
  .payment-terms strong{ display: block; color: #0f172a; font-size: 13px; margin-bottom: 4px; }
  
  .totals-table{ width: 45%; border-collapse: collapse; }
  .totals-table td{ padding: 10px 0; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
  .totals-table td:first-child{ color:#64748b; font-weight:600; }
  .totals-table td:last-child{ text-align:right; font-weight:700; color:#0f172a; }
  
  .totals-table tr.grand-total td{
    border-top: 2px solid #0f172a; border-bottom: 2px solid #0f172a;
    padding: 12px 0; font-size: 18px; font-weight: 800; color: #047857;
  }

  .inv-in-words{ background: #f8fafc; border-radius: 6px; padding: 12px; text-align: center; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 40px; border: 1px dashed #cbd5e1;}

  /* Footer Layout */
  .inv-footer{ display: flex; justify-content: space-between; align-items: flex-end; padding-top: 20px; margin-top: 20px; }
  .inv-footer .contact-info{ font-size: 12px; color: #64748b; line-height: 1.8; }
  .inv-footer .contact-info strong{ color: #0f172a; font-size: 12px; }
  .inv-footer .signature-area{ text-align: center; }
  .inv-footer .signature-img{ max-height: 50px; margin-bottom: 5px; display: block; }
  .inv-footer .signature-line{
    border-top: 1.5px solid #0f172a; padding-top: 8px; font-size: 13px; font-weight: 700;
    color: #0f172a; width: 200px; font-family: 'Playfair Display', serif;
  }

  /* =====================================================
     PREMIUM RECEIPT TEMPLATE (A5 Sized)
  ===================================================== */
  .receipt-wrap{
    font-size:12px;background:#fff;padding:35px; width:100%; max-width:600px; margin:0 auto; 
    border:1px solid #e2e8f0; border-radius: 8px; line-height: 1.5; font-family: 'Inter', sans-serif;
    position: relative;
  }
  .receipt-wrap::before {
    content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
    background: linear-gradient(90deg, #047857, #10b981, #34d399); border-radius: 8px 8px 0 0;
  }
  .rc-header{text-align:center;border-bottom:1px solid #e2e8f0;padding-bottom:15px;margin-bottom:20px;}
  .rc-header img{ max-height:60px; margin-bottom:10px; }
  .rc-header h1{font-size:20px; font-family: 'Playfair Display', serif; font-weight:700; color:#dc2626; margin-bottom:4px;}
  .rc-header h2{color:#047857;font-size:14px;margin-top:4px; letter-spacing:1.5px; text-transform: uppercase; font-weight:700;}
  .rc-header p{font-size:12px;color:#64748b;margin-top:3px;}
  
  .rc-box{border:1px solid #e2e8f0; border-radius:8px;padding:15px;margin:15px 0;background:#f8fafc;}
  .rc-row{display:flex;justify-content:space-between;padding:8px 0;font-size:12px;border-bottom:1px dashed #cbd5e1;}
  .rc-row:last-child{border:none;}
  .rc-row span{color:#64748b; font-weight:600;}
  .rc-row b{color:#0f172a; font-size:13px;}
  
  .rc-amount{font-size:28px;color:#047857;font-weight:900;text-align:center;padding:15px;background:#ecfdf5;border:2px solid #a7f3d0;border-radius:8px;margin:15px 0; letter-spacing:1px;}
  .rc-amount small{display:block;font-size:11px;font-weight:600;color:#047857;margin-bottom:4px; text-transform: uppercase; letter-spacing:1px;}
  
  .rc-words{text-align:center;font-size:12px;color:#334155;font-weight:600;margin-bottom:20px;}
  .rc-footer{text-align:center;font-size:11px;color:#64748b;margin-top:15px;padding-top:15px;border-top:1px dashed #cbd5e1;}
  
  .rc-sign{display:flex;justify-content:space-between;width:100%;margin-top:40px;font-size:12px; font-weight:600;}
  .rc-sign div{text-align:center;border-top:1px solid #0f172a;padding-top:6px;width:140px; font-family: 'Playfair Display', serif;}

  /* =====================================================
     STATEMENT TEMPLATE (Confirmation of Account)
  ===================================================== */
  .statement-wrap{
    font-size:13px;background:#fff;padding:40px; width:100%; max-width:850px; margin:0 auto; 
    border:1px solid #e2e8f0; border-radius: 8px; line-height: 1.5; font-family: 'Inter', sans-serif;
    position: relative;
  }
  .st-header { text-align: center; border-bottom: 2px solid #047857; padding-bottom: 20px; margin-bottom: 20px; }
  .st-header h1 { font-family: 'Playfair Display', serif; color: #dc2626; font-size: 24px; font-weight: 900; margin-bottom: 5px;}
  .st-header h2 { color: #047857; font-size: 18px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .st-header p { font-size: 12px; color: #64748b; margin-top: 5px; }
  
  .st-info { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 13px; }
  .st-info div strong { display: block; color: #64748b; font-size: 11px; margin-bottom: 2px; text-transform: uppercase;}
  
  .st-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  .st-table th { background: #f8fafc; border-bottom: 2px solid #cbd5e1; padding: 10px; text-align: left; font-size: 12px; color: #475569; text-transform: uppercase;}
  .st-table td { padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
  .st-table th:last-child, .st-table td:last-child { text-align: right; }
  
  .st-summary { display: flex; justify-content: flex-end; margin-bottom: 30px; }
  .st-summary table { width: 40%; border-collapse: collapse; }
  .st-summary td { padding: 8px 10px; font-size: 13px; border-bottom: 1px solid #e2e8f0; }
  .st-summary td:last-child { text-align: right; font-weight: 700; }
  .st-summary tr.grand td { background: #047857; color: #fff; font-weight: 800; font-size: 15px; border: none; }
  
  .st-sign { display: flex; justify-content: space-between; margin-top: 60px; }
  .st-sign div { text-align: center; border-top: 1px solid #0f172a; padding-top: 5px; width: 180px; font-weight: 700; font-size: 13px; font-family: 'Playfair Display', serif;}

  /* item builder */
  .item-builder{ background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px;margin-bottom:10px; }
  .item-builder .remove-row{ background:#fee2e2;color:#991b1b;border:none;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;margin-top:4px; }
  .add-item-btn{ width:100%;padding:12px;background:#fff;border:2px dashed #047857;color:#047857;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:15px; }
  .add-item-btn:active{transform:scale(.98);}

  /* total box */
  .total-box{ background:linear-gradient(135deg, #064e3b, #047857);color:#fff;border-radius:12px;padding:16px;margin:15px 0;text-align:center; box-shadow:0 4px 12px rgba(4,120,87,.3); }
  .total-box .label{font-size:12px;opacity:.9;margin-bottom:6px; font-weight:600; letter-spacing:0.5px;}
  .total-box .amount{font-size:28px;font-weight:900;}

  /* category row */
  .cat-row{ background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border-left:4px solid #0891b2;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;justify-content:space-between;align-items:center;gap:8px; }
  .cat-row .cat-info{flex:1;cursor:pointer;min-width:0;}
  .cat-row .cat-actions{display:flex;gap:4px;flex-shrink:0;}
  .cat-row .cat-actions button{ width:30px;height:30px;border-radius:7px;border:none;font-size:14px;cursor:pointer;background:#f1f5f9;color:#64748b;transition:.2s; }
  .cat-row .cat-actions button:active{transform:scale(.9);}
  .cat-row .cat-actions .edit{background:#ecfdf5;color:#047857;}
  .cat-row .cat-actions .del{background:#fee2e2;color:#991b1b;}

  /* tab pills */
  .tab-pills{ display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding:2px; }
  .tab-pills::-webkit-scrollbar{display:none;}
  .tab-pill{ padding:8px 14px;background:#fff;border:1px solid #e2e8f0;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;color:#64748b;white-space:nowrap;transition:.2s; }
  .tab-pill.active{background:#047857;color:#fff;border-color:#047857;}

  /* Search Result Card */
  .search-result-card {
    background: #fff; border: 2px solid #10b981; border-radius: 12px; padding: 20px; margin-bottom: 16px;
    box-shadow: 0 4px 12px rgba(16,185,129,.15); animation: slideUp .3s ease;
  }
  .search-result-card h3 { color: #047857; font-size: 18px; margin-bottom: 8px; }
  .search-result-card p { font-size: 13px; color: #64748b; margin-bottom: 4px; }
  .search-result-card .highlight { font-weight: 700; color: #0f172a; }
  .search-result-card .btn { margin-top: 12px; }
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loadingScreen">
  <div class="spinner"></div>
  <h2>Connecting to Cloud...</h2>
</div>

<div class="top-bar hidden" id="topBar">
  <button class="icon-btn hidden" id="backBtn" onclick="goBack()">←</button>
  <button class="icon-btn" id="homeBtn" onclick="goHome()" title="Home">🏠</button>
  <div class="title-wrap">
    <h1 id="pageTitle">Billing System</h1>
    <div class="sub" id="pageSub">Project Management</div>
  </div>
  <div class="top-actions" id="topActions"></div>
</div>

<div class="breadcrumb hidden" id="breadcrumb"></div>

<div class="container" id="pageContent"></div>

    const loading = document.getElementById('loadingScreen');

    if (user) {
      window.currentUser = user;
      loading.classList.add('hidden');
      topBar.classList.remove('hidden');

      window.currentUser = null;
      loading.classList.add('hidden');

  window.logout = () => {

  // App Loading / Data Sync Logic
  let unsubscribeSnapshot = null;

  function startApp() {
    const docRef = doc(db, "users", currentUser.uid, "data", "main");
    
    // Listen to changes in real-time
    unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.projects) localStorage.setItem('ewb_projects', JSON.stringify(data.projects));
        if (data.owners) localStorage.setItem('ewb_owners', JSON.stringify(data.owners));
        if (data.invoices) localStorage.setItem('ewb_invoices', JSON.stringify(data.invoices));
        if (data.payments) localStorage.setItem('ewb_payments', JSON.stringify(data.payments));
        if (data.settings) localStorage.setItem('ewb_settings', JSON.stringify(data.settings));
        if (data.categories) localStorage.setItem('ewb_categories', JSON.stringify(data.categories));
      } else {
        // First time user, no cloud data, default values will be set by app script
      }
      
      // Once data is loaded, render the app
      if (window.renderApp) window.renderApp();
    }, (error) => {
      console.error("Snapshot error:", error);
    });
  }

  // Function to save data to firestore (Triggered by App)
  window.saveToCloud = async (key, value) => {
    if (!currentUser) return false;
    try {
      const docRef = doc(db, "users", currentUser.uid, "data", "main");
      await setDoc(docRef, { [key]: value }, { merge: true });
      return true;
    } catch (e) {
      console.error("Error saving to cloud", e);
      return false;
    }
  };

function toast(msg, type=''){

function fmt(n){ return '৳ ' + Number(n||0).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtDate(d){
  if(!d) return '—';
  return new Date(d).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
}
function today(){ return new Date().toISOString().split('T')[0]; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function openModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('modal').classList.add('show'); }

function numberToWords(num){
  num = Math.floor(Number(num)||0);
  if(num === 0) return 'Zero Taka Only';
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigit(n){ if(n<20) return ones[n]; const t = Math.floor(n/10), o = n%10; return tens[t] + (o?' '+ones[o]:''); }
  function threeDigit(n){ const h = Math.floor(n/100), r = n%100; let s = ''; if(h) s += ones[h] + ' Hundred'; if(r) s += (s?' ':'') + twoDigit(r); return s; }
  let result = '';
  const crore = Math.floor(num/10000000); const lakh = Math.floor((num%10000000)/100000);
  const thousand = Math.floor((num%100000)/1000); const rest = num%1000;
  if(crore) result += threeDigit(crore) + ' Crore ';
  if(lakh) result += threeDigit(lakh) + ' Lakh ';
  if(thousand) result += threeDigit(thousand) + ' Thousand ';
  if(rest) result += threeDigit(rest);
  return result.trim() + ' Taka Only';
}

function setTopBar(title, sub, showBack, showFab, fabActionName, topActions){
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('pageSub').textContent = sub || '';
  document.getElementById('backBtn').classList.toggle('hidden', !showBack);
  const fab = document.getElementById('fab');
  fab.classList.toggle('hidden', !showFab);
  if(fabActionName) fab.dataset.action = fabActionName; else delete fab.dataset.action;
  const ta = document.getElementById('topActions');
  
  let actionsHtml = '';
  if(topActions && topActions.length){ 
    actionsHtml = topActions.map(a=>`<button class="top-btn" onclick="${a.action}">${a.label}</button>`).join(''); 
  }
  // Always add logout button if logged in
  if(window.currentUser) {
    actionsHtml += `<button class="top-btn" style="background:#ef4444;" onclick="logout()">Logout</button>`;
  }
  ta.innerHTML = actionsHtml;
}

function setBreadcrumb(items){
  const bc = document.getElementById('breadcrumb');
  if(!items || items.length === 0){ bc.classList.add('hidden'); return; }
  bc.classList.remove('hidden');
  bc.innerHTML = items.map((it,i)=>{ const last = i === items.length - 1; return last ? `<span>${esc(it.label)}</span>` : `${esc(it.label)} ›`; }).join(' ');
}

function navigate(view, params){
  if(State.view !== view){
    State.history.push({ view: State.view, projectId: State.projectId, ownerId: State.ownerId, category: State.category, invoiceId: State.invoiceId, receiptId: State.receiptId, ownerTab: State.ownerTab });
  }
  State.view = view;
  if(params){ for(const k in params){ if(k in State) State[k] = params[k]; } }
  render();
  window.scrollTo(0,0);
}

function goBack(){
  if(State.history.length === 0){ State.view='projects'; render(); return; }
  const prev = State.history.pop();
  Object.assign(State, prev);
  render();
  window.scrollTo(0,0);
}

function goHome(){
  State.history = [];
  State.view = 'projects';
  State.projectId = null;
  State.ownerId = null;
  render();
  window.scrollTo(0,0);
}

window.renderApp = function() {
  if(!window.currentUser) return;
  render();
};

  const pays = DB.get('payments').filter(p => p.receiptNo.toUpperCase().includes(q));
  const container = document.getElementById('searchResultContainer');

    const inv = invs[0];
    const p = DB.get('projects').find(x=>x.id===inv.projectId);

      </div>
    `;
    return;
  }

  if(pays.length > 0){
    const py = pays[0];

    const o = DB.get('owners').find(x=>x.id===py.ownerId);

  let total = 0;

function saveInvoice(){
  const invNo = document.getElementById('invNo').value.trim();
  const date = document.getElementById('invDate').value || today();
  const subject = document.getElementById('invSubject').value.trim();
  const discount = Number(document.getElementById('invDiscount').value) || 0;
  const paid = Number(document.getElementById('invPaid').value) || 0;
  const terms = document.getElementById('invTerms').value.trim();

  const items = [];
  document.querySelectorAll('.item-builder').forEach(b=>{
    const desc = b.querySelector('.it-desc').value.trim();
    const qty = Number(b.querySelector('.it-qty').value) || 0;
    const unit = b.querySelector('.it-unit').value.trim() || 'Pcs';
    const rate = Number(b.querySelector('.it-rate').value) || 0;
    if(desc && qty > 0 && rate > 0) items.push({ desc, qty, unit, rate });
  });

  if(items.length === 0){ toast('Add at least one item','error'); return; }

  const inv = { id: uid(), invoiceNo: invNo || ('INV-' + Date.now().toString().slice(-6)), projectId: State.projectId, ownerId: State.ownerId, category: State.category, date, subject, discount, paid, terms, items, createdAt: Date.now() };
  const all = DB.get('invoices'); all.push(inv); DB.set('invoices', all);
  toast('Invoice saved ✓','success');
  navigate('invoice-view', {invoiceId: inv.id});
}

function buildStatementHTML(p, o){
  const s = getSettings();
  const invs = DB.get('invoices').filter(i=>i.ownerId===o.id).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const pays = DB.get('payments').filter(py=>py.ownerId===o.id).sort((a,b)=>new Date(a.date)-new Date(b.date));
  
  let totalBill = 0;
  let totalPaid = 0;
  let transactions = [];

  invs.forEach(i => {
    let sub = i.items.reduce((sum,it)=>sum+Number(it.qty)*Number(it.rate),0);
    let amt = sub - (Number(i.discount)||0);
    totalBill += amt;
    transactions.push({ date: i.date, type: 'Invoice', ref: i.invoiceNo, desc: i.subject, debit: amt, credit: 0 });
  });

  pays.forEach(py => {
    totalPaid += Number(py.amount);
    let inv = DB.get('invoices').find(x=>x.id===py.invoiceId);
    transactions.push({ date: py.date, type: 'Payment', ref: py.receiptNo, desc: inv ? inv.invoiceNo : 'General Payment', debit: 0, credit: Number(py.amount) });
  });

  transactions.sort((a,b) => new Date(a.date) - new Date(b.date));
  let balance = 0;

  return `
    <div class="statement-wrap">
      <div class="st-header">
        ${s.logo ? `<img src="${s.logo}" style="max-height:60px;margin-bottom:10px;">` : ''}
        <h1>${esc(s.companyName)}</h1>
        <h2>Confirmation of Account</h2>
        <p>${esc(s.address)}</p>
      </div>

      <div class="st-info">
        <div>
          <strong>Account Name</strong>
          ${esc(o.name)}<br>
          ${esc(o.unit || '')}<br>
          ${esc(o.phone || '')}
        </div>
        <div style="text-align:right;">
          <strong>Statement Date</strong>
          ${fmtDate(today())}<br>
          <strong>Project</strong>
          ${esc(p.name)}
        </div>
      </div>

      <table class="st-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Ref No.</th>
            <th>Description</th>
            <th>Debit</th>
            <th>Credit</th>
            <th>Balance</th>
          </tr>
        </thead>
        <tbody>
          ${transactions.map(t => {
            if(t.type === 'Invoice') balance += t.debit;
            else balance -= t.credit;
            return `
              <tr>
                <td>${fmtDate(t.date)}</td>
                <td>${t.type}</td>
                <td>${t.ref}</td>
                <td>${t.desc}</td>
                <td>${t.debit > 0 ? fmt(t.debit) : '-'}</td>
                <td>${t.credit > 0 ? fmt(t.credit) : '-'}</td>
                <td>${fmt(balance)}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>

      <div class="st-summary">
        <table>
          <tr><td>Total Billed Amount</td><td>${fmt(totalBill)}</td></tr>
          <tr><td>Total Paid Amount</td><td>${fmt(totalPaid)}</td></tr>
          <tr class="grand"><td>Closing Balance</td><td>${fmt(totalBill - totalPaid)}</td></tr>
        </table>
      </div>

      <div style="font-size:13px;color:#475569;margin-bottom:20px;">
        <strong>In Words:</strong> ${numberToWords(totalBill - totalPaid)}
      </div>

      <div class="st-sign">
        <div>Client Signature</div>
        <div style="border:none;">
          ${s.signatureImg ? `<img src="${s.signatureImg}" style="max-height:40px;margin-bottom:4px;">` : ''}
          <div style="border-top:1px solid #0f172a; padding-top:5px;">${esc(s.signName)}</div>
        </div>
      </div>
    </div>
  `;
}

function createPDFBlob(htmlContent, format) {
  return new Promise((resolve, reject) => {
    const iframe = document.getElementById('pdfIframe');
    const doc = iframe.contentWindow.document;
    
    doc.open();
    doc.write(`
      <!DOCTYPE html><html><head>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
      <style>${document.querySelector('style').innerHTML}</style>
      </head><body style="background:#fff; margin:0;">${htmlContent}</body></html>
    `);
    doc.close();

    setTimeout(() => {
      const element = doc.querySelector('.invoice-wrap') || doc.querySelector('.receipt-wrap') || doc.querySelector('.statement-wrap');
      if(!element) return reject('Element not found');
      
      html2pdf().set({
        margin: 0,
        image:{type:'jpeg', quality:1},
        html2canvas:{scale:2, useCORS:true, backgroundColor:'#ffffff', logging:false},
        jsPDF:{unit:'mm', format:format, orientation:'portrait'}
      }).from(element).outputPdf('blob').then(blob => {
        resolve(blob);
      }).catch(e => reject(e));
    }, 500);
  });
}

function savePayment(invId){
  const amount = Number(document.getElementById('payAmount').value) || 0;
  const date = document.getElementById('payDate').value || today();
  const method = document.getElementById('payMethod').value;
  const note = document.getElementById('payNote').value.trim();
  if(amount <= 0){ toast('Enter a valid amount','error'); return; }

  const rcNo = 'RC-' + new Date().getFullYear() + '-' + String(Date.now()).slice(-6);
  const py = { id: uid(), receiptNo: rcNo, invoiceId: invId, projectId: State.projectId, ownerId: State.ownerId, amount, date, method, note, createdAt: Date.now() };
  const all = DB.get('payments'); all.push(py); DB.set('payments', all);

  if(invId){
    const invs = DB.get('invoices');
    const inv = invs.find(i=>i.id===invId);
    if(inv){ inv.paid = (Number(inv.paid)||0) + amount; DB.set('invoices', invs); }
  }

  closeModal(); toast('Payment saved ✓','success');
  if(invId){
    setTimeout(()=>{ if(confirm('Payment saved! View receipt now?')){ viewReceipt(py.id); } }, 300);
  } else {
    renderOwner();
  }
}

  DB.set('invoices', DB.get('invoices').filter(x=>x.ownerId!==oid));
  DB.set('payments', DB.get('payments').filter(x=>x.ownerId!==oid));
  closeModal(); toast('Owner deleted','success'); State.view = 'project'; State.ownerId = null; render();
}

function fabAction(){
  const a = document.getElementById('fab').dataset.action;
  if(a === 'add-project') openAddProjectModal();
  else if(a === 'add-owner') openAddOwnerModal();
  else if(a === 'add-invoice') navigate('invoice-new');
  else if(a === 'add-category') openAddCategoryModal();
}

function openAddProjectModal(){
  openModal(`
    <h2>New Project <button class="modal-close" onclick="closeModal()">✕</button></h2>
    <div class="form-group"><label>Project Name *</label><input type="text" id="npName" placeholder="e.g. Rahman Villa"></div>
    <div class="form-group"><label>Address</label><textarea id="npAddress" rows="2" placeholder="Project address"></textarea></div>
    <button class="btn btn-primary" onclick="saveNewProject()">✅ Save</button>
  `);
}

function saveNewProject(){
  const name = document.getElementById('npName').value.trim();
  const address = document.getElementById('npAddress').value.trim();
  if(!name){ toast('Enter project name','error'); return; }
  const projects = DB.get('projects'); projects.push({ id: uid(), name, address, createdAt: Date.now() }); DB.set('projects', projects);
  closeModal(); toast('Project created ✓','success'); renderProjects();
}

function openAddOwnerModal(){
  openModal(`
    <h2>New Owner <button class="modal-close" onclick="closeModal()">✕</button></h2>
    <div class="form-group"><label>Name *</label><input type="text" id="noName" placeholder="e.g. Mehedi Hasan"></div>
    <div class="form-row">
      <div class="form-group"><label>Mobile</label><input type="tel" id="noPhone" placeholder="01XXXXXXXXX"></div>
      <div class="form-group"><label>Unit / Flat</label><input type="text" id="noUnit" placeholder="A-4, 3rd Floor"></div>
    </div>
    <div class="form-group"><label>Address</label><textarea id="noAddress" rows="2" placeholder="Owner address"></textarea></div>
    <button class="btn btn-owner" onclick="saveNewOwner()">✅ Save</button>
  `);
}

function saveNewOwner(){
  const name = document.getElementById('noName').value.trim();
  const phone = document.getElementById('noPhone').value.trim();
  const unit = document.getElementById('noUnit').value.trim();
  const address = document.getElementById('noAddress').value.trim();
  if(!name){ toast('Enter owner name','error'); return; }
  const owners = DB.get('owners'); owners.push({ id: uid(), projectId: State.projectId, name, phone, unit, address, createdAt: Date.now() }); DB.set('owners', owners);
  closeModal(); toast('Owner created ✓','success'); renderProject();
}

// Start App is defined inside the module above and triggers window.renderApp
</script>
</body>
